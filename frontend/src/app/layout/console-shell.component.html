<a class="skip-link" href="#console-main">Pular para o conteudo principal</a>

<header class="console-header">
  <div class="console-header__inner">
    <a
      class="console-brand"
      routerLink="/operacao/esportes"
      aria-label="BETUFU - operacao esportiva">
      <span class="console-brand__mark" aria-hidden="true">B</span>
      <span>BETUFU</span>
    </a>

    <div class="console-context">
      <span class="console-context__eyebrow">Console operacional</span>
      <strong>Operacao esportiva</strong>
    </div>

    <nav class="console-nav" aria-label="Navegacao do console">
      @for (destination of operationDestinations(); track destination.path) {
        <a
          [routerLink]="destination.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: destination.path === '/operacao/esportes' }"
          >{{ destination.label }}</a
        >
      }
      <a routerLink="/" (click)="closeMenu()">Arena</a>
      <button
        type="button"
        class="console-nav__account"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()">
        {{ sessionStore.displayName() || 'Conta' }}
      </button>
    </nav>

    @if (menuOpen()) {
      <div class="console-menu">
        <a routerLink="/conta/perfil" (click)="closeMenu()">Meu perfil</a>
        <button type="button" (click)="logout()">Sair</button>
      </div>
    }
  </div>
</header>

<main #consoleMain id="console-main" class="console-main" tabindex="-1">
  <router-outlet />
</main>
