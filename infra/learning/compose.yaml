name: betufu-learning

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: docker.io/library/postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    platform: linux/amd64
    mem_limit: 1g
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      BETUFU_DB_NAME: betufu_learning
      BETUFU_DB_USER: betufu_runtime
      BETUFU_DB_PASSWORD: ${BETUFU_DB_PASSWORD:?Defina BETUFU_DB_PASSWORD}
      BETUFU_FLYWAY_USER: betufu_migrator
      BETUFU_FLYWAY_PASSWORD: ${BETUFU_FLYWAY_PASSWORD:?Defina BETUFU_FLYWAY_PASSWORD}
      KEYCLOAK_DB_NAME: keycloak_learning
      KEYCLOAK_DB_USER: keycloak_runtime
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ../postgres/init-databases.sh
        target: /docker-entrypoint-initdb.d/init-databases.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: docker.io/library/redis:8.10.0-trixie@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    platform: linux/amd64
    mem_limit: 512m
    logging: *logging
    command: [redis-server, --appendonly, "yes", --requirepass, "${BETUFU_REDIS_PASSWORD:?Defina BETUFU_REDIS_PASSWORD}", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    environment:
      REDISCLI_AUTH: ${BETUFU_REDIS_PASSWORD:?Defina BETUFU_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, -e, ping]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak:
    image: 855763870789.dkr.ecr.sa-east-1.amazonaws.com/betufu/keycloak@sha256:4ae99a0b041905dbce17c7866bfcfbb25319b70e5801580af8c00701d88d3dc2
    platform: linux/amd64
    mem_limit: 1536m
    logging: *logging
    command:
      - start
      - --import-realm
      - --spi-events-listener--betufu-password-event-listener--enabled=true
      - --spi-events-listener--betufu-password-event-listener--key-id=v1
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak_learning
      KC_DB_USERNAME: keycloak_runtime
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: learning-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Defina KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      BETUFU_OIDC_CLIENT_SECRET: ${BETUFU_OIDC_CLIENT_SECRET:?Defina BETUFU_OIDC_CLIENT_SECRET}
      BETUFU_TECHNICAL_PASSWORD: ${BETUFU_TECHNICAL_PASSWORD:?Defina BETUFU_TECHNICAL_PASSWORD}
      BETUFU_PASSWORD_RESET_ENDPOINT: https://backend:8080/api/v1/internal/events/password-reset
      BETUFU_PASSWORD_RESET_HMAC_KEY: ${BETUFU_PASSWORD_RESET_KEY_V1:?Defina BETUFU_PASSWORD_RESET_KEY_V1}
      BETUFU_PASSWORD_RESET_KEY_ID: v1
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
      JAVA_OPTS_APPEND: >-
        -Djavax.net.ssl.trustStore=/run/secrets/tls/keycloak-truststore.jks
        -Djavax.net.ssl.trustStorePassword=${BETUFU_TLS_TRUSTSTORE_PASSWORD:?Defina BETUFU_TLS_TRUSTSTORE_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - type: bind
        source: ../keycloak/realm-betufu.json
        target: /opt/keycloak/data/import/betufu-local-realm.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../keycloak/themes/betufu
        target: /opt/keycloak/themes/betufu
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/truststores/keycloak-truststore.jks
        target: /run/secrets/tls/keycloak-truststore.jks
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3
          grep -m1 -E '^HTTP/1\.[01] 200' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    platform: linux/amd64
    mem_limit: 768m
    logging: *logging
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -s3.cert.file=/run/secrets/tls/seaweedfs.crt
      - -s3.key.file=/run/secrets/tls/seaweedfs.key
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: ${BETUFU_S3_ACCESS_KEY_ID:?Defina BETUFU_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BETUFU_S3_SECRET_ACCESS_KEY:?Defina BETUFU_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: betufu-learning-private
      GOMEMLIMIT: 512MiB
    volumes:
      - seaweed-data:/data
      - type: bind
        source: ./secrets/seaweedfs.crt
        target: /run/secrets/tls/seaweedfs.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/seaweedfs.key
        target: /run/secrets/tls/seaweedfs.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/ca.crt
        target: /run/secrets/tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --cacert, /run/secrets/tls/ca.crt, "https://localhost:8333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: docker.io/axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    platform: linux/amd64
    mem_limit: 256m
    logging: *logging
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    image: 855763870789.dkr.ecr.sa-east-1.amazonaws.com/betufu/backend@sha256:8a7e896cb31f98efa34bf10bd58ebd1bf555bad93e174d96f5564d9a9b6b00a6
    platform: linux/amd64
    mem_limit: 2g
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: homolog
      BETUFU_LOCAL_OIDC_PROXY: "true"
      BETUFU_DB_JDBC_URL: jdbc:postgresql://postgres:5432/betufu_learning
      BETUFU_DB_USER: betufu_runtime
      BETUFU_DB_PASSWORD: ${BETUFU_DB_PASSWORD:?Defina BETUFU_DB_PASSWORD}
      BETUFU_FLYWAY_USER: betufu_migrator
      BETUFU_FLYWAY_PASSWORD: ${BETUFU_FLYWAY_PASSWORD:?Defina BETUFU_FLYWAY_PASSWORD}
      BETUFU_REDIS_HOST: redis
      BETUFU_REDIS_PORT: "6379"
      BETUFU_REDIS_PASSWORD: ${BETUFU_REDIS_PASSWORD:?Defina BETUFU_REDIS_PASSWORD}
      BETUFU_OIDC_ISSUER_URI: http://localhost:8081/realms/betufu-local
      BETUFU_OIDC_CLIENT_ID: betufu-bff
      BETUFU_OIDC_CLIENT_SECRET: ${BETUFU_OIDC_CLIENT_SECRET:?Defina BETUFU_OIDC_CLIENT_SECRET}
      BETUFU_TECHNICAL_USERNAME: technical
      BETUFU_TECHNICAL_PASSWORD: ${BETUFU_TECHNICAL_PASSWORD:?Defina BETUFU_TECHNICAL_PASSWORD}
      BETUFU_MATRICULA_HMAC_KEY_CURRENT_VERSION: v1
      BETUFU_MATRICULA_HMAC_KEY_V1: ${BETUFU_MATRICULA_HMAC_KEY_V1:?Defina BETUFU_MATRICULA_HMAC_KEY_V1}
      BETUFU_PASSWORD_RESET_CURRENT_VERSION: v1
      BETUFU_PASSWORD_RESET_KEY_V1: ${BETUFU_PASSWORD_RESET_KEY_V1:?Defina BETUFU_PASSWORD_RESET_KEY_V1}
      BETUFU_PASSWORD_RESET_MAINTENANCE_ENABLED: "true"
      BETUFU_PUBLIC_ORIGIN: http://localhost:4200
      BETUFU_BACKEND_ORIGIN: https://backend:8080
      # Tomcat espera uma expressão regular, não uma lista de CIDRs.
      BETUFU_TRUSTED_PROXIES: '172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}'
      BETUFU_S3_ENABLED: "true"
      BETUFU_S3_ENDPOINT: https://seaweedfs:8333
      BETUFU_S3_REGION: sa-east-1
      BETUFU_S3_BUCKET: betufu-learning-private
      BETUFU_S3_ACCESS_KEY_ID: ${BETUFU_S3_ACCESS_KEY_ID:?Defina BETUFU_S3_ACCESS_KEY_ID}
      BETUFU_S3_SECRET_ACCESS_KEY: ${BETUFU_S3_SECRET_ACCESS_KEY:?Defina BETUFU_S3_SECRET_ACCESS_KEY}
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/secrets/tls/backend.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_STORE_PASSWORD: ${BETUFU_TLS_KEYSTORE_PASSWORD:?Defina BETUFU_TLS_KEYSTORE_PASSWORD}
      JAVA_OPTS: >-
        -XX:+UseZGC -XX:MaxRAMPercentage=65.0
        -Djavax.net.ssl.trustStore=/run/secrets/tls/backend-truststore.jks
        -Djavax.net.ssl.trustStorePassword=${BETUFU_TLS_TRUSTSTORE_PASSWORD:?Defina BETUFU_TLS_TRUSTSTORE_PASSWORD}
    volumes:
      - type: bind
        source: ./secrets/backend.p12
        target: /run/secrets/tls/backend.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/truststores/backend-truststore.jks
        target: /run/secrets/tls/backend-truststore.jks
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/ca.crt
        target: /run/secrets/tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --cacert, /run/secrets/tls/ca.crt, "https://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  frontend:
    image: 855763870789.dkr.ecr.sa-east-1.amazonaws.com/betufu/frontend@sha256:062deb50a76e2ca7c645d29feb2997e5c0abc18123cc03f0a002c3118bb66197
    platform: linux/amd64
    mem_limit: 128m
    logging: *logging
    ports:
      - "127.0.0.1:4200:8080"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/ca.crt
        target: /run/secrets/tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  seaweed-data:
  mailpit-data:
