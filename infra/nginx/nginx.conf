# infra/nginx/nginx.conf
# Configuração segura do Nginx para o modo full da BETUFU.
# Portas: escuta em 8080 (mapeado para 4200 no host).
# Garante paridade exata de origem (http://localhost:4200) com o modo daily (proxy.conf.json).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;

    # 1. Segurança: Bloqueio estrito de arquivos ocultos e segredos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # 2. Segurança: Bloqueio explícito de source maps (.map) em produção
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # 3. Proxy BFF: /api (paridade regex ^/api(?:/|$))
    location ~ ^/api(?:/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 4200;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Prevenção rigorosa de cache para dados de sessão e autenticação
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 4. Proxy BFF: /oauth2 (paridade regex ^/oauth2(?:/|$))
    location ~ ^/oauth2(?:/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 4200;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 5. Proxy BFF: /login (paridade regex ^/login(?:/|$))
    location ~ ^/login(?:/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 4200;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 6. WebSocket: /ws (preparação para chat/notificações com upgrade dinâmico de conexão)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 4200;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Frontend Angular: arquivos estáticos com HTML5 SPA routing fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
