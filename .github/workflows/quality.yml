name: Quality gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publication_review:
        description: Validate publication evidence (does not deploy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  local-quality:
    name: Isolated local technical gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Restore pinned frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts
      - name: Maven, Node, Angular, Flyway, Modulith, OpenAPI, production, isolated50-user load and vulnerability gates
        run: node scripts/phase7-quality.mjs --local

  publication-review:
    name: Publication evidence (blocked until actual institutional review)
    if: github.event_name == 'workflow_dispatch' && inputs.publication_review
    needs: local-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Refresh dependency security evidence on this checkout
        run: node scripts/phase7-quality.mjs --scan-security
      - name: Fail closed on missing identity, personal identifiers or evidence
        run: node scripts/phase7-quality.mjs --publication
