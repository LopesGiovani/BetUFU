spring:
  application:
    name: betufu-backend
  profiles:
    group:
      dev:
        - runtime
      homolog:
        - runtime
      prod:
        - runtime

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: "${BETUFU_SESSION_COOKIE_SAME_SITE:lax}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: "runtime | integrated"
  datasource:
    url: "${BETUFU_DB_JDBC_URL}"
    username: "${BETUFU_DB_USER}"
    password: "${BETUFU_DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: "${BETUFU_OIDC_ISSUER_URI}"
        registration:
          keycloak:
            provider: keycloak
            client-id: "${BETUFU_OIDC_CLIENT_ID}"
            client-secret: "${BETUFU_OIDC_CLIENT_SECRET}"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
