spring:
  application:
    name: betufu-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    group:
      dev:
        - runtime
      homolog:
        - runtime
      prod:
        - runtime

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: "${BETUFU_SESSION_COOKIE_SAME_SITE:lax}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

betufu:
  bootstrap:
    admin-identifier: "${BETUFU_BOOTSTRAP_ADMIN_IDENTIFIER:}"
  verification:
    matricula-hmac:
      current-version: "${BETUFU_MATRICULA_HMAC_KEY_CURRENT_VERSION}"
      keys:
        v1: "${BETUFU_MATRICULA_HMAC_KEY_V1}"
  session:
    password-reset:
      current-version: "${BETUFU_PASSWORD_RESET_CURRENT_VERSION:}"
      previous-version: "${BETUFU_PASSWORD_RESET_PREVIOUS_VERSION:}"
      maintenance-enabled: "${BETUFU_PASSWORD_RESET_MAINTENANCE_ENABLED:false}"
      keys:
        v1: "${BETUFU_PASSWORD_RESET_KEY_V1:}"
        v2: "${BETUFU_PASSWORD_RESET_KEY_V2:}"
  media:
    max-bytes: "${BETUFU_MEDIA_MAX_BYTES:5242880}"
    max-pixels: "${BETUFU_MEDIA_MAX_PIXELS:4000000}"
  s3:
    enabled: "${BETUFU_S3_ENABLED:false}"
    endpoint: "${BETUFU_S3_ENDPOINT:}"
    region: "${BETUFU_S3_REGION:us-east-1}"
    bucket: "${BETUFU_S3_BUCKET:}"
    access-key-id: "${BETUFU_S3_ACCESS_KEY_ID:}"
    secret-access-key: "${BETUFU_S3_SECRET_ACCESS_KEY:}"
    force-path-style: "${BETUFU_S3_FORCE_PATH_STYLE:true}"

---
spring:
  config:
    activate:
      on-profile: "runtime | integrated"
  datasource:
    url: "${BETUFU_DB_JDBC_URL}"
    username: "${BETUFU_DB_USER}"
    password: "${BETUFU_DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: "${BETUFU_FLYWAY_USER}"
    password: "${BETUFU_FLYWAY_PASSWORD}"
  session:
    timeout: 8h
    data:
      redis:
        namespace: betufu:session
        repository-type: indexed
        flush-mode: on-save
        save-mode: on-set-attribute
  data:
    redis:
      host: "${BETUFU_REDIS_HOST}"
      port: "${BETUFU_REDIS_PORT}"
      password: "${BETUFU_REDIS_PASSWORD}"
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: "${BETUFU_OIDC_ISSUER_URI}"
        registration:
          keycloak:
            provider: keycloak
            client-id: "${BETUFU_OIDC_CLIENT_ID}"
            client-secret: "${BETUFU_OIDC_CLIENT_SECRET}"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
