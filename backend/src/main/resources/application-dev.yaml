spring:
  config:
    activate:
      on-profile: dev
  # Temporário: o Plano 01-06 remove esta exceção ao configurar Spring Session Data Redis.
  autoconfigure:
    exclude: "org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration"

betufu:
  web:
    public-origin: "http://localhost:4200"
    backend-origin: "http://127.0.0.1:8080"

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      host-header: "X-Forwarded-Host"
      protocol-header: "X-Forwarded-Proto"
      remote-ip-header: "X-Forwarded-For"
      internal-proxies: "127.0.0.1/32,::1/128"
