  /api/v1/operations/sports/editions/{editionId}/events:
    post:
      tags:
        - SportsOperations
      operationId: createSportsEvent
      summary: Criar um evento esportivo em rascunho
      description: >-
        Carrega a edição persistida, deriva sua `competitionId` e exige a
        concessão ADMINISTRADOR_COMPETICAO com `scopeRef` exatamente igual.
        O cliente não escolhe o escopo de autorização.
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportsEventCreateRequest"
      responses:
        "201":
          description: Evento criado no estado RASCUNHO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsEventResponse"
        "400":
          description: Dados do evento inválidos (Problem Details).
        "401":
          description: Requisição não autenticada.
        "403":
          description: Papel ausente ou concedido para outra competição.
        "404":
          description: Edição não encontrada (Problem Details).

  /api/v1/operations/sports/events/{eventId}/publications:
    post:
      tags:
        - SportsOperations
      operationId: publishSportsEvent
      summary: Publicar uma versão imutável do evento
      description: >-
        Carrega o evento, deriva sua competição, valida o papel escopado e cria
        um snapshot append-only. Uma `expectedLockVersion` desatualizada recebe
        409 sem sobrescrever trabalho concorrente.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportsEventPublishRequest"
      responses:
        "201":
          description: Snapshot público imutável criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSportsEventResponse"
        "400":
          description: Versão esperada ausente ou inválida (Problem Details).
        "401":
          description: Requisição não autenticada.
        "403":
          description: Papel ausente ou concedido para outra competição.
        "404":
          description: Evento não encontrado (Problem Details).
        "409":
          description: Rascunho desatualizado ou já publicado (Problem Details).

  /api/v1/public/sports/events/{eventId}:
    get:
      tags:
        - SportsPublic
      operationId: getPublishedSportsEvent
      summary: Consultar a versão pública de um evento
      description: >-
        Endpoint anônimo que retorna somente o snapshot publicado mais recente.
        Rascunho, ator da publicação, papéis e versão técnica de edição não
        atravessam esta fronteira.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshot público mais recente do evento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSportsEventResponse"
        "404":
          description: Evento sem versão publicada (Problem Details).

  /api/v1/public/sports/events:
    get:
      tags:
        - SportsPublic
      operationId: listPublishedSportsEvents
      summary: Listar a agenda pública de eventos publicados
      description: >-
        Endpoint anônimo orientado por agenda. Retorna somente o snapshot mais
        recente de eventos PUBLICADO, em ordem estável por horário e UUID. Os
        filtros correspondem somente a campos persistidos no snapshot público.
        Modalidade, categoria, fase e estado são adicionados quando presentes
        no catálogo V10; eventos V9 sem catálogo continuam compatíveis.
      parameters:
        - name: competitionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: editionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sportId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: phaseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SportsVenueState"
        - name: from
          in: query
          required: false
          description: Limite inferior inclusivo do horário agendado em UTC.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Limite superior inclusivo do horário agendado em UTC.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: Página de eventos publicados visíveis ao visitante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSportsEventPage"
        "400":
          description: Filtro ou paginação inválida (Problem Details).

