            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportsStandingsSummary"
        "401":
          description: Requisição não autenticada.
        "403":
          description: Edição fora do escopo autorizado.
        "404":
          description: Edição não encontrada.
    post:
      tags:
        - SportsStandings
      operationId: createSportsStandings
      summary: Criar nova classificação em rascunho
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportsStandingsCreateRequest"
      responses:
        "201":
          description: Classificação criada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsStandingsSummary"
        "400":
          description: Dados inválidos para criação da classificação.
        "401":
          description: Requisição não autenticada.
        "403":
          description: Edição fora do escopo autorizado.
        "404":
          description: Edição ou entidade do catálogo não encontrada.

  /api/v1/operations/sports/standings/{standingsId}:
    get:
      tags:
        - SportsStandings
      operationId: getSportsStandings
      summary: Consultar pré-visualização ou rascunho da classificação
      parameters:
        - name: standingsId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pré-visualização da classificação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsStandingsSnapshot"
        "401":
          description: Requisição não autenticada.
        "403":
          description: Classificação fora do escopo autorizado.
        "404":
          description: Classificação não encontrada.
    put:
      tags:
        - SportsStandings
      operationId: updateSportsStandings
      summary: Atualizar rascunho de classificação com colunas e linhas
      parameters:
        - name: standingsId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedLockVersion
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportsStandingsUpdateRequest"
      responses:
        "200":
          description: Classificação atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsStandingsSnapshot"
        "400":
          description: Linhas/colunas inválidas ou classificação já publicada.
        "401":
          description: Requisição não autenticada.
        "403":
          description: Classificação fora do escopo autorizado.
        "404":
          description: Classificação não encontrada.
        "409":
          description: Versão de lock obsoleta.

  /api/v1/operations/sports/standings/{standingsId}/publish:
    post:
      tags:
        - SportsStandings
      operationId: publishSportsStandings
      summary: Publicar classificação oficial com fonte
      parameters:
        - name: standingsId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedLockVersion
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportsStandingsPublishRequest"
      responses:
        "200":
          description: Classificação publicada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsStandingsSnapshot"
        "400":
          description: Fonte ausente ou classificação sem dados.
        "401":
          description: Requisição não autenticada.
        "403":
          description: Classificação fora do escopo autorizado.
        "404":
          description: Classificação não encontrada.
        "409":
          description: Versão de lock obsoleta.

  /api/v1/operations/sports/standings/{standingsId}/correct:
    post:
      tags:
        - SportsStandings
      operationId: correctSportsStandings
      summary: Corrigir classificação publicada com motivo auditado
      parameters:
        - name: standingsId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedLockVersion
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportsStandingsCorrectRequest"
      responses:
        "200":
          description: Nova versão da classificação publicada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsStandingsSnapshot"
        "400":
          description: Motivo ou fonte ausentes ou classificação não publicada.
        "401":
          description: Requisição não autenticada.
        "403":
          description: Classificação fora do escopo autorizado.
        "404":
          description: Classificação não encontrada.
        "409":
          description: Versão de lock obsoleta.

  /api/v1/public/odds/markets/{marketId}:
    get:
      tags:
        - OddsPublic
      operationId: getPublicOddsMarket
      summary: Consultar a odd atual, o histórico e a explicação pública
      description: >-
        Consulta anônima somente leitura. A projeção contém a odd publicada,
        estado público e referências opacas de versão; não inclui identidade de
        operador, evidência interna, volume de apostas ou dados de atletas.
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumo público do mercado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOddsView"
        "404":
          description: Mercado não encontrado ou não publicado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"

  /api/v1/operations/odds/markets:
    post:
      tags:
        - OddsMarket
      operationId: createOddsMarket
      summary: Criar mercado administrativo de confronto direto
      description: Comando autenticado, autorizado pelo escopo persistido da competição.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOddsMarketRequest"
      responses:
        "201":
          description: Mercado criado em DRAFT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsMarketView"
        "400":
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "401":
          description: Requisição não autenticada.
        "403":
          description: Escopo operacional não autorizado.
        "409":
          description: Idempotência ou estado concorrente em conflito.

  /api/v1/operations/odds/markets/{marketId}:
    get:
      tags:
        - OddsMarket
      operationId: getOddsMarket
      summary: Consultar mercado administrativo
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado administrativo atual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsMarketView"
        "401":
          description: Requisição não autenticada.
        "403":
          description: Escopo operacional não autorizado.
        "404":
          description: Mercado não encontrado.

  /api/v1/operations/odds/markets/{marketId}/lifecycle:
    post:
      tags:
        - OddsMarket
      operationId: transitionOddsMarketLifecycle
      summary: Publicar, suspender ou alterar o lifecycle do mercado
      description: >-
        Cada transição exige a versão de lock esperada e gera fato auditável;
        estados CLOSED, LOCKED e CANCELLED não aceitam mutações indevidas.
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedLockVersion
          in: query
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OddsMarketLifecycleRequest"
      responses:
        "200":
          description: Mercado após a transição.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsMarketView"
        "400":
          description: Transição ou motivo inválido.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "401":
          description: Requisição não autenticada.
        "403":
          description: Escopo operacional não autorizado.
        "409":
          description: Lock obsoleto ou transição incompatível.

  /api/v1/operations/odds/markets/{marketId}/overrides:
    post:
      tags:
        - OddsOverride
      operationId: proposeOddsOverride
      summary: Propor correção excepcional de odd
      description: >-
        Operação autenticada de dupla custódia. Somente mercado SUSPENDED com
        tentativa de correção previamente registrada pode receber proposta.
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OddsOverrideProposalRequest"
      responses:
        "200":
          description: Proposta append-only criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsOverrideView"
        "400":
          description: Proposta inválida.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "401":
          description: Requisição não autenticada.
        "403":
          description: Escopo, estado ou política de correção não autorizado.
        "409":
          description: Lock ou idempotência em conflito.

  /api/v1/operations/odds/markets/{marketId}/overrides/{proposalId}/approve:
    post:
      tags:
        - OddsOverride
      operationId: approveOddsOverride
      summary: Aprovar proposta de override por administrador distinto
      description: >-
        A aprovação maker-checker exige outro administrador no mesmo escopo;
        cria nova versão de mercado e preserva todas as versões anteriores.
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OddsOverrideApprovalRequest"
      responses:
        "200":
          description: Override aprovado e versionado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsOverrideView"
        "400":
          description: Aprovação inválida.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "401":
          description: Requisição não autenticada.
        "403":
          description: Autoaprovação, escopo alheio ou estado não autorizado.
        "409":
          description: Proposta já decidida ou lock obsoleto.

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Chave opaca para repetição segura do mesmo comando.

    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Chave opaca obrigatória para repetição segura do comando de override.

  schemas:
    CreditBalanceResponse:
      type: object
      additionalProperties: false
      required: [balance, scale, minimumStake, rulesVersion]
      properties:
        balance: {type: number, format: double}
        scale: {type: integer, example: 2}
        minimumStake: {type: number, format: double}
        rulesVersion: {type: string}

    PredictionSubmitRequest:
      type: object
      additionalProperties: false
      required: [marketId, marketVersionId, publicationId, ruleVersion, selection, stake]
      properties:
        marketId: {type: string, format: uuid}
        marketVersionId: {type: string, format: uuid}
        publicationId: {type: string, format: uuid}
        ruleVersion: {type: string}
        selection: {type: string, enum: [HOME, DRAW, AWAY]}
        stake: {type: number, format: double}

    PredictionTicketResponse:
      type: object
      additionalProperties: false
      required:
        - predictionId
        - marketId
        - marketVersionId
        - publicationId
        - selection
        - stake
        - acceptedOdds
        - potentialReturn
        - netProfit
        - ruleVersion
        - closeDeadline
        - state
        - acceptedAt
      properties:
        predictionId: {type: string, format: uuid}
        marketId: {type: string, format: uuid}
        marketVersionId: {type: string, format: uuid}
        publicationId: {type: string, format: uuid}
        selection: {type: string, enum: [HOME, DRAW, AWAY]}
        stake: {type: number, format: double}
        acceptedOdds: {type: number, format: double}
        potentialReturn: {type: number, format: double}
        netProfit: {type: number, format: double}
        ruleVersion: {type: string}
        closeDeadline: {type: string, format: date-time}
        state: {type: string}
        acceptedAt: {type: string, format: date-time}

    OddsLineageReferences:
      type: object
      additionalProperties: false
      required:
        - marketId
        - marketVersionId
        - publishedPriceVersionId
        - confirmedVersionId
      properties:
        marketId:
          type: string
          format: uuid
          description: Identificador opaco e estável do mercado.
        marketVersionId:
          type: string
          format: uuid
          description: Versão imutável do mercado usada na publicação.
        publishedPriceVersionId:
          type: [string, "null"]
          format: uuid
          description: Versão imutável do preço publicado, quando existente.
        confirmedVersionId:
          type: [string, "null"]
          format: uuid
          description: Referência exata à versão confirmada de resultado em V16.

    PublicOddsSummary:
      type: object
      additionalProperties: false
      required:
        - publicationId
        - publishedOdds
        - publishedAt
      properties:
        publicationId:
          type: string
          format: uuid
        publishedOdds:
          type: array
          minItems: 1
          items:
            type: number
            format: double
            minimum: 1
        publishedAt:
          type: string
          format: date-time

    PublicOddsHistory:
      type: object
      additionalProperties: false
      required:
        - publicationId
        - publishedOdds
        - publishedAt
      properties:
        publicationId:
          type: string
          format: uuid
        publishedOdds:
          type: number
          format: double
          minimum: 1
        publishedAt:
          type: string
          format: date-time

    PublicOddsExplanation:
      type: object
      additionalProperties: false
      required:
        - algorithmVersion
        - configurationVersion
        - fairProbability
        - margin
        - roundingMode
        - confidence
        - confidenceBand
        - sampleSize
      properties:
        algorithmVersion:
          type: string
        configurationVersion:
          type: string
        fairProbability:
          type: number
          format: double
          minimum: 0
          maximum: 1
        margin:
          type: number
          format: double
          minimum: 0
        roundingMode:
          type: string
          enum: [HALF_UP]
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        confidenceBand:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        sampleSize:
          type: integer
          format: int32
          minimum: 0

    PublicOddsView:
      type: object
      additionalProperties: false
      required:
        - marketId
        - marketVersionId
        - eventId
        - marketType
        - state
        - closeDeadline
        - current
        - history
        - explanation
      properties:
        marketId:
          type: string
          format: uuid
        marketVersionId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        marketType:
          type: string
          enum: [HEAD_TO_HEAD]
        state:
          $ref: "#/components/schemas/OddsMarketState"
        closeDeadline:
          type: string
          format: date-time
        current:
          $ref: "#/components/schemas/PublicOddsSummary"
        history:
          type: array
          items:
            $ref: "#/components/schemas/PublicOddsHistory"
        explanation:
          $ref: "#/components/schemas/PublicOddsExplanation"

    OddsMarketState:
      type: string
      enum: [DRAFT, OPEN, SUSPENDED, CLOSED, LOCKED, CANCELLED]

    SportsRosterSnapshotForOdds:
      type: object
      additionalProperties: false
      required:
        - teamId
        - competitionId
        - editionId
        - publicationId
        - versionNo
        - knownAt
      properties:
        teamId:
          type: string
          format: uuid
        competitionId:
          type: string
          format: uuid
        editionId:
          type: string
          format: uuid
        publicationId:
          type: string
          format: uuid
        versionNo:
          type: integer
          format: int64
          minimum: 1
        knownAt:
          type: string
          format: date-time

    CreateOddsMarketRequest:
      type: object
      additionalProperties: false
      required:
        - eventId
      properties:
        eventId:
          type: string
          format: uuid
        regulationAllowsDraw:
          type: boolean
          default: false
        closeDeadline:
          type: string
          format: date-time
        margin:
          type: number
          format: double
          minimum: 0
        rosterSnapshots:
          type: array
          items:
            $ref: "#/components/schemas/SportsRosterSnapshotForOdds"

    OddsMarketLifecycleRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum: [PUBLISH_MARKET, SUSPEND_MARKET, RESUME_MARKET, CLOSE_DEADLINE, LOCK_MARKET, CANCEL_MARKET]
        expectedLockVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 512

    OddsMarketView:
      type: object
      additionalProperties: false
      required:
        - marketId
        - eventId
        - marketType
        - state
        - currentVersionId
        - versionNo
        - lockVersion
        - createdAt
        - updatedAt
      properties:
        marketId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        marketType:
          type: string
          enum: [HEAD_TO_HEAD]
        state:
          $ref: "#/components/schemas/OddsMarketState"
        currentVersionId:
          type: string
          format: uuid
        marketVersionId:
          type: [string, "null"]
          format: uuid
        publishedPriceVersionId:
          type: [string, "null"]
          format: uuid
        confirmedVersionId:
          type: [string, "null"]
          format: uuid
        versionNo:
          type: integer
          format: int64
          minimum: 0
        closeDeadline:
          type: [string, "null"]
          format: date-time
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OddsOverrideProposalRequest:
      type: object
      additionalProperties: false
      required:
        - correctionCalculationId
        - previousOdds
        - proposedOdds
        - evidenceReference
        - reason
        - expectedLockVersion
      properties:
        correctionCalculationId:
          type: string
          format: uuid
        previousOdds:
          type: number
          format: double
          exclusiveMinimum: 0
        proposedOdds:
          type: number
          format: double
          exclusiveMinimum: 0
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 256
        reason:
          type: string
          minLength: 1
          maxLength: 512
        expectedLockVersion:
          type: integer
          format: int64
          minimum: 0

    OddsOverrideApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - expectedLockVersion
        - reason
      properties:
        expectedLockVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 512

    OddsOverrideView:
      type: object
      additionalProperties: false
      required:
        - overrideId
        - marketId
        - calculationId
        - decision
        - previousOdds
        - proposedOdds
        - delta
        - createdAt
      properties:
        overrideId:
          type: string
          format: uuid
        marketId:
          type: string
          format: uuid
        calculationId:
          type: string
          format: uuid
        proposerId:
          type: [string, "null"]
          format: uuid
          description: Campo administrativo não retornado pela projeção pública.
        approverId:
          type: [string, "null"]
          format: uuid
          description: Campo administrativo não retornado pela projeção pública.
        decision:
          type: string
          enum: [PROPOSED, APPROVED, REJECTED]
        previousOdds:
          type: number
          format: double
          exclusiveMinimum: 0
        proposedOdds:
          type: number
          format: double
          exclusiveMinimum: 0
        delta:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time

    CurrentIdentityResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - status
        - createdAt
        - updatedAt
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        status:
          type: string
          enum:
            - PERSISTED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CurrentProfileResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - nickname
        - nicknameUpdatedAt
        - matriculaStatus
        - favoriteOrganizationId
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        nickname:
          type: string
          description: Apelido público do usuário (3 a 20 caracteres ASCII).
        nicknameUpdatedAt:
          type: [string, "null"]
          format: date-time
          description: Instante em UTC da última alteração do apelido, ou nulo se nunca alterado.
        matriculaStatus:
          type: string
          description: Estado de verificação de vínculo institucional.
        favoriteOrganizationId:
          type: [string, "null"]
          format: uuid
          description: Organização esportiva favorita, ou nulo quando não escolhida.

    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 3
          pattern: '^[\x00-\x20]*[A-Za-z0-9_-]{3,20}[\x00-\x20]*(?![\s\S])'
          description: >-
            Apelido desejado com 3 a 20 caracteres (ASCII letras, números,
            hífen ou sublinhado); caracteres de U+0000 a U+0020 nas pontas são
            removidos antes da validação, como em String.trim() no Java.

    FavoriteOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - organizationId
      properties:
        organizationId:
          type: [string, "null"]
          format: uuid
          description: ID estável da organização publicada; nulo remove o favorito.

    EnrollmentStatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - createdAt
      properties:
        status:
          type: string
          description: Estado do vínculo de matrícula institucional (ex. NAO_REGISTRADA, ATIVO).
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Instante em UTC do registro do vínculo, ou nulo se não registrado.

    EnrollmentRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - matricula
      properties:
        matricula:
          type: string
          description: >-
            Número de matrícula da UFU a ser vinculado à conta institucional
            (5 a 20 caracteres alfanuméricos após normalização e remoção de
            separadores).

    EnrollmentCorrectionRequest:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - matricula
        - reason
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta alvo da correção de matrícula.
        matricula:
          type: string
          description: >-
            Novo número de matrícula da UFU a ser vinculado à conta institucional
            (5 a 20 caracteres alfanuméricos após normalização e remoção de
            separadores).
        reason:
          type: string
          minLength: 10
          maxLength: 1024
          x-betufu-max-utf8-bytes: 1024
          description: >-
            Motivo auditável por extenso da correção administrativa (mínimo de 10
            caracteres e máximo autoritativo de 1024 octetos UTF-8). O maxLength
            documenta o teto em caracteres; o backend também mede os bytes UTF-8.

    EnrollmentCorrectionResponse:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - status
        - correctedAt
        - previousBindingReleased
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta corrigida.
        status:
          type: string
          description: Estado do vínculo resultante (ex. ATIVO).
        correctedAt:
          type: string
          format: date-time
          description: Instante em UTC da correção do vínculo atribuído pelo PostgreSQL.
        previousBindingReleased:
          type: boolean
          description: Indica se havia vínculo anterior e se ele foi liberado.

    BetufuFieldViolation:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Nome estável do campo recusado.
        message:
          type: string
          description: Explicação pública e sanitizada da violação.

    BetufuProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - code
        - action
      properties:
        type:
          type: string
          format: uri-reference
          description: Identificador RFC 9457 do tipo do problema; about:blank quando genérico.
        title:
          type: string
          description: Título público estável em português.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: Status HTTP associado ao problema.
        detail:
          type: string
          description: Explicação pública sanitizada, sem detalhe interno ou dado sensível.
        instance:
          type: string
          format: uri-reference
          description: Identificador opcional da ocorrência segundo RFC 9457.
        code:
          type: string
          description: Código BETUFU estável para decisão do cliente.
        action:
          type: string
          description: Ação segura recomendada à pessoa usuária.
        correlationId:
          type: string
          description: Código opaco opcional para suporte e correlação de logs.
        fieldErrors:
          type: array
          description: Violações de campos presentes somente em erros de validação.
          items:
            $ref: "#/components/schemas/BetufuFieldViolation"

    SessionStateResponse:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - idleTimeout
        - absoluteTimeout
      properties:
        authenticated:
          type: boolean
        displayName:
          type: [string, "null"]
          description: Nome de exibição não sensível, ausente quando anônimo.
        idleTimeout:
          type: string
          description: Duração ISO-8601 do prazo de inatividade, sempre `PT8H`.
        absoluteTimeout:
          type: [string, "null"]
          description: >-
            Sempre nulo no MVP. Emitido explicitamente, per D-06, para
            representar a ausência de prazo absoluto em vez de omiti-la.
        lastValidActivityAt:
          type: [string, "null"]
          format: date-time

    CurrentDeviceLogoutResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - endSessionUrl
      properties:
        status:
          type: string
          enum:
            - LOGGED_OUT
            - END_SESSION_UNAVAILABLE
        endSessionUrl:
          type: [string, "null"]
          description: >-
            URL pública de RP-initiated logout, ou nulo quando o provedor não
            publica `end_session_endpoint`. Nunca contém token.

    DiagnosticResponse:
      type: object
      additionalProperties: false
      required:
