      responses:
        "201":
          description: Competição criada com UUID gerado pelo servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsCompetitionResponse"
        "400":
          description: Nome ou slug inválido (Problem Details).
        "401":
          description: Requisição não autenticada.
        "403":
          description: Ator sem ADMINISTRADOR_GERAL global.

