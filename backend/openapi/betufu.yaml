    post:
      tags:
        - SportsOperations
      operationId: createSportsEdition
      summary: Criar uma edição de competição
      description: >-
        Cria uma edição sob a competição persistida indicada. Exige
        ADMINISTRADOR_GERAL global e CSRF.
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
