openapi: 3.1.0

info:
  title: BETUFU API
  version: 0.1.0

servers:
  - url: /

paths:
  /api/v1/tracer/identity/current:
    put:
      tags:
        - Identity
      operationId: putCurrentIdentity
      summary: Persistir e reler a identidade local atual
      description: >-
        Usa a sessão BFF autenticada do navegador. O cliente usa uma URL
        same-origin e não envia bearer token, cookie manual ou credenciais
        configuradas.
      responses:
        "200":
          description: Identidade local persistida e relida com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentityResponse"

  /api/v1/session:
    get:
      tags:
        - Session
      operationId: getSession
      summary: Consultar o estado seguro da sessão atual
      description: >-
        Projeção segura da sessão, entregue pelo Plano 01-22. Não retorna
        identificador de sessão, cookie, token nem claims completas. A consulta
        não renova o prazo de inatividade e é o único par anônimo de
        `/api/v1/**`, para que a SPA possa perguntar se está autenticada sem ser
        redirecionada ao provedor.
      responses:
        "200":
          description: Estado da sessão, autenticada ou não.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStateResponse"

  /api/v1/session/logout:
    post:
      tags:
        - Session
      operationId: logoutCurrentSession
      summary: Encerrar somente a sessão do dispositivo atual
      description: >-
        Encerra apenas a sessão BFF corrente, per D-08 e D-09; as demais sessões
        do usuário permanecem válidas. Protegido por CSRF. A URL devolvida usa
        `client_id` e um `post_logout_redirect_uri` same-origin, sem
        `id_token_hint`, porque o ID token é material de autenticação e uma URL
        entregue ao navegador vaza por histórico e log de proxy.
      responses:
        "200":
          description: Sessão local encerrada e coordenação disponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDeviceLogoutResponse"
        "502":
          description: >-
            Sessão local encerrada, mas o `end_session_endpoint` não estava
            disponível. O corpo é sanitizado e não revela endpoint nem motivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDeviceLogoutResponse"

  /api/v1/profile/me:
    get:
      tags:
        - Profile
      operationId: getMyProfile
      summary: Consultar o perfil da conta autenticada atual
      description: >-
        Retorna a projeção pública do perfil BETUFU associado à sessão BFF
        autenticada atual, conforme PROF-01, PROF-02 e PRIV-01. Não expõe e-mail,
        matrícula, HMAC, papéis ou MFA. Retorna 404 se a identidade ainda não
        possuir perfil criado.
      responses:
        "200":
          description: Perfil próprio consultado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "404":
          description: Perfil não encontrado para a identidade atual.
    put:
      tags:
        - Profile
      operationId: putMyProfile
      summary: Criar ou atualizar o apelido do perfil próprio
      description: >-
        Cria o perfil ou atualiza o apelido da conta autenticada atual,
        respeitando a regra de cooldown de 30 dias entre trocas reais e
        idempotência ao reenviar o mesmo apelido (PROF-01, D-45). Valida o
        formato de 3 a 20 caracteres ASCII permitidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Perfil próprio criado ou atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "400":
          description: Requisição inválida ou violação de formato do apelido.
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "422":
          description: Violação da regra de negócio (ex. cooldown de 30 dias ativo).

  /api/v1/enrollment/me:
    get:
      tags:
        - Enrollment
      operationId: getEnrollment
      summary: Consultar o estado do vínculo de matrícula da conta autenticada atual
      description: >-
        Retorna o estado do vínculo voluntário da matrícula UFU da conta autenticada
        atual (VERI-06, VERI-09, PRIV-01). Não expõe o número da matrícula, digest,
        versão de chave, papéis, MFA, contadores ou janelas de limitação. Retorna
        status NAO_REGISTRADA com createdAt nulo quando a conta ainda não possui
        matrícula registrada.
      responses:
        "200":
          description: Estado do vínculo de matrícula consultado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentStatusResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
    put:
      tags:
        - Enrollment
      operationId: putEnrollment
      summary: Registrar o vínculo de matrícula da conta autenticada atual
      description: >-
        Registra voluntariamente o vínculo da matrícula institucional UFU para a
        conta autenticada atual (VERI-06, VERI-07, VERI-09, PRIV-01). A matrícula é
        normalizada e protegida por HMAC versionado antes da persistência. Recusa
        segundo registro na mesma conta (409 CONTA_JA_VINCULADA), duplicidade em
        outra conta sob todas as versões de chave ativas (409 MATRICULA_DUPLICADA) e
        excesso de tentativas por conta e origem (429 TOO_MANY_ATTEMPTS), utilizando
        Problem Details (RFC 9457).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRegistrationRequest"
      responses:
        "200":
          description: Vínculo de matrícula registrado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentStatusResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "400":
          description: Formato de matrícula inválido ou ausente (Problem Details).
        "409":
          description: "Conflito de negócio: conta já vinculada ou matrícula já registrada em outra conta (Problem Details)."
        "429":
          description: Limite de tentativas de registro excedido (Problem Details).

  /api/v1/operations/roles/{targetIdentityId}:
    get:
      tags:
        - Role
      operationId: getRoles
      summary: Consultar o estado dos papéis operacionais de uma identidade
      description: >-
        Retorna o estado de concessão dos papéis operacionais (ADMINISTRADOR_GERAL,
        ADMINISTRADOR_COMPETICAO, MODERADOR) e o apelido associado à identidade alvo
        (OPER-01, OPER-02, OPER-04, PRIV-01). Exige papel ADMINISTRADOR_GERAL na sessão
        autenticada. Não expõe e-mail, matrícula, digest ou MFA.
      parameters:
        - name: targetIdentityId
          in: path
          required: true
          description: Identificador opaco da conta alvo da consulta.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Papéis e apelido da identidade consultados com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrantResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "401":
          description: Requisição não autenticada.
        "403":
          description: Autenticado sem o papel ADMINISTRADOR_GERAL (Problem Details).

  /api/v1/operations/roles/grants:
    post:
      tags:
        - Role
      operationId: grantRole
      summary: Conceder um papel operacional a uma conta
      description: >-
        Concede um papel operacional a uma identidade alvo (OPER-01, OPER-02, OPER-06,
        PRIV-01). A concessão é idempotente e auditada. Recusa autoconcessão (403
        SELF_GRANT_BLOCKED), papel escopado sem escopo (400) e papel global com escopo (400).
        Exige papel ADMINISTRADOR_GERAL na sessão autenticada. Encerra as sessões da
        identidade afetada (D-49).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleGrantRequest"
      responses:
        "200":
          description: Papel concedido ou já vigente com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrantResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "400":
          description: Requisição inválida ou inconsistência entre papel e escopo (Problem Details).
        "401":
          description: Requisição não autenticada.
        "403":
          description: Autenticado sem permissão ou autoconcessão bloqueada (Problem Details).

  /api/v1/operations/roles/revocations:
    post:
      tags:
        - Role
      operationId: revokeRole
      summary: Revogar um papel operacional de uma conta
      description: >-
        Revoga um papel operacional de uma identidade alvo (OPER-01, OPER-02, OPER-06,
        PRIV-01). A revogação é auditada e encerra as sessões da identidade afetada (D-49).
        Recusa a revogação do próprio papel de ADMINISTRADOR_GERAL quando for o último
        administrador geral vigente (409 LAST_ADMIN). Exige papel ADMINISTRADOR_GERAL na
        sessão autenticada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleGrantRequest"
      responses:
        "200":
          description: Papel revogado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrantResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "400":
          description: Requisição inválida ou inconsistência entre papel e escopo (Problem Details).
        "401":
          description: Requisição não autenticada.
        "403":
          description: Autenticado sem permissão (Problem Details).
        "409":
          description: Conflito ao revogar o último administrador geral vigente (Problem Details).

  /api/v1/operations/password-reset-events/failed:
    get:
      tags:
        - PasswordResetRecovery
      operationId: listFailedPasswordResetEvents
      summary: Listar eventos de redefinicao de senha com falha
      description: >-
        Lista metadados operacionais dos eventos FAILED disponiveis para recuperacao.
        Exige sessao OIDC com papel ADMINISTRADOR_GERAL global e nao expoe payload,
        subject, realm, segredo HMAC ou token.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Eventos com falha consultados com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetEventRecoveryPageResponse"
        "302":
          description: Requisicao anonima redirecionada ao fluxo OIDC do BFF.
        "401":
          description: Requisicao nao autenticada.
        "403":
          description: Ator sem concessao global de ADMINISTRADOR_GERAL.

  /api/v1/operations/password-reset-events/{sourceEventId}:
    get:
      tags:
        - PasswordResetRecovery
      operationId: getPasswordResetEvent
      summary: Consultar um evento de redefinicao de senha
      description: >-
        Consulta o estado operacional de um evento pelo identificador opaco da origem.
        Exige sessao OIDC com papel ADMINISTRADOR_GERAL global.
      parameters:
        - name: sourceEventId
          in: path
          required: true
          description: Identificador opaco e idempotente atribuido pela origem.
          schema:
            type: string
      responses:
        "200":
          description: Evento consultado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetEventRecoveryResponse"
        "302":
          description: Requisicao anonima redirecionada ao fluxo OIDC do BFF.
        "401":
          description: Requisicao nao autenticada.
        "403":
          description: Ator sem concessao global de ADMINISTRADOR_GERAL.
        "404":
          description: Evento nao encontrado.

  /api/v1/operations/password-reset-events/{sourceEventId}/reprocess:
    post:
      tags:
        - PasswordResetRecovery
      operationId: reprocessPasswordResetEvent
      summary: Reprocessar um evento de redefinicao de senha
      description: >-
        Reprocessa de forma idempotente um evento FAILED. A operacao exige CSRF e
        sessao OIDC com papel ADMINISTRADOR_GERAL global, e registra auditoria.
      parameters:
        - name: sourceEventId
          in: path
          required: true
          description: Identificador opaco e idempotente atribuido pela origem.
          schema:
            type: string
      responses:
        "200":
          description: Evento reprocessado ou ja entregue de forma idempotente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetEventRecoveryResponse"
        "302":
          description: Requisicao anonima redirecionada ao fluxo OIDC do BFF.
        "401":
          description: Requisicao nao autenticada.
        "403":
          description: Ator sem concessao global de ADMINISTRADOR_GERAL.
        "404":
          description: Evento nao encontrado.

  /api/v1/operations/enrollments/correction:
    post:
      tags:
        - Enrollment
      operationId: correctEnrollment
      summary: Corrigir administrativamente o vínculo de matrícula de uma conta
      description: >-
        Substitui de forma atômica e auditada o vínculo de matrícula UFU de uma
        conta identificada por UUID público (VERI-07, OPER-01, AUDT-01, PRIV-01,
        D-32). O vínculo anterior é marcado como LIBERADO e preservado no histórico,
        e a nova matrícula é vinculada sob a versão de chave ativa corrente.
        Exige papel ADMINISTRADOR_GERAL na sessão autenticada, CSRF e motivo
        obrigatório. A resposta não expõe número de matrícula, digest HMAC ou versão de chave.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentCorrectionRequest"
      responses:
        "200":
          description: Vínculo de matrícula corrigido com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentCorrectionResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "400":
          description: Requisição inválida, formato de matrícula inválido ou motivo ausente/curto (Problem Details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "401":
          description: Requisição não autenticada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "403":
          description: Autenticado sem o papel ADMINISTRADOR_GERAL (Problem Details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "404":
          description: Conta alvo não encontrada (Problem Details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"
        "409":
          description: Conflito de negócio, nova matrícula já vinculada a outra conta (Problem Details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BetufuProblemDetails"

  /api/v1/operations/panel:
    get:
      tags:
        - OperationalPanel
      operationId: getOperationalPanel
      summary: Consultar o painel operacional governado por papel
      description: >-
        Retorna a projeção operacional do painel com recorte temporal de sete
        dias (OPER-01, OPER-02, OPER-04, OPER-06, S4). Os quatro blocos são
        opcionais e deliberadamente omitidos da serialização quando o papel não
        os autoriza (ausência no servidor). Moderadores recebem resposta válida
        200 sem blocos. Falhas isoladas em blocos autorizados são declaradas em
        `unavailableBlocks` sem divulgar exceções nem escopo não autorizado. Não
        expõe e-mail, matrícula, HMAC, digest, segredo ou lista de identidades.
      responses:
        "200":
          description: Projeção operacional consultada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalPanelResponse"
        "302":
          description: Requisição anônima redirecionada ao fluxo OIDC do BFF.
          headers:
            Location:
              description: Destino do fluxo de autenticação hospedado.
              schema:
                type: string
        "401":
          description: Requisição não autenticada.
        "403":
          description: Autenticado sem papel operacional autorizado (Problem Details).

  /api/v1/diagnostic:
    get:
      tags:
        - Diagnostic
      operationId: getDiagnostic
      summary: Consultar o diagnóstico das dependências da plataforma
      description: >-
        Existe somente nos profiles `dev` e `homolog`, per D-02: em produção não
        há bean nem mapping, e portanto o path não é alcançável. Exige a
        autoridade `ROLE_TECHNICAL`, produzida exclusivamente pelo handoff
        allowlistado da claim aprovada no Gate 1 do Plano 01-03.
      responses:
        "200":
          description: Projeção diagnóstica com exatamente seis componentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticResponse"
        "401":
          description: Requisição anônima.
        "403":
          description: Autenticado sem a autoridade técnica.

components:
  schemas:
    CurrentIdentityResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - status
        - createdAt
        - updatedAt
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        status:
          type: string
          enum:
            - PERSISTED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CurrentProfileResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - nickname
        - nicknameUpdatedAt
        - matriculaStatus
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        nickname:
          type: string
          description: Apelido público do usuário (3 a 20 caracteres ASCII).
        nicknameUpdatedAt:
          type: [string, "null"]
          format: date-time
          description: Instante em UTC da última alteração do apelido, ou nulo se nunca alterado.
        matriculaStatus:
          type: string
          description: Estado de verificação de vínculo institucional.

    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 3
          pattern: '^[\x00-\x20]*[A-Za-z0-9_-]{3,20}[\x00-\x20]*(?![\s\S])'
          description: >-
            Apelido desejado com 3 a 20 caracteres (ASCII letras, números,
            hífen ou sublinhado); caracteres de U+0000 a U+0020 nas pontas são
            removidos antes da validação, como em String.trim() no Java.

    EnrollmentStatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - createdAt
      properties:
        status:
          type: string
          description: Estado do vínculo de matrícula institucional (ex. NAO_REGISTRADA, ATIVO).
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Instante em UTC do registro do vínculo, ou nulo se não registrado.

    EnrollmentRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - matricula
      properties:
        matricula:
          type: string
          description: >-
            Número de matrícula da UFU a ser vinculado à conta institucional
            (5 a 20 caracteres alfanuméricos após normalização e remoção de
            separadores).

    EnrollmentCorrectionRequest:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - matricula
        - reason
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta alvo da correção de matrícula.
        matricula:
          type: string
          description: >-
            Novo número de matrícula da UFU a ser vinculado à conta institucional
            (5 a 20 caracteres alfanuméricos após normalização e remoção de
            separadores).
        reason:
          type: string
          minLength: 10
          maxLength: 1024
          x-betufu-max-utf8-bytes: 1024
          description: >-
            Motivo auditável por extenso da correção administrativa (mínimo de 10
            caracteres e máximo autoritativo de 1024 octetos UTF-8). O maxLength
            documenta o teto em caracteres; o backend também mede os bytes UTF-8.

    EnrollmentCorrectionResponse:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - status
        - correctedAt
        - previousBindingReleased
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta corrigida.
        status:
          type: string
          description: Estado do vínculo resultante (ex. ATIVO).
        correctedAt:
          type: string
          format: date-time
          description: Instante em UTC da correção do vínculo atribuído pelo PostgreSQL.
        previousBindingReleased:
          type: boolean
          description: Indica se havia vínculo anterior e se ele foi liberado.

    BetufuFieldViolation:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Nome estável do campo recusado.
        message:
          type: string
          description: Explicação pública e sanitizada da violação.

    BetufuProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - code
        - action
      properties:
        type:
          type: string
          format: uri-reference
          description: Identificador RFC 9457 do tipo do problema; about:blank quando genérico.
        title:
          type: string
          description: Título público estável em português.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: Status HTTP associado ao problema.
        detail:
          type: string
          description: Explicação pública sanitizada, sem detalhe interno ou dado sensível.
        instance:
          type: string
          format: uri-reference
          description: Identificador opcional da ocorrência segundo RFC 9457.
        code:
          type: string
          description: Código BETUFU estável para decisão do cliente.
        action:
          type: string
          description: Ação segura recomendada à pessoa usuária.
        correlationId:
          type: string
          description: Código opaco opcional para suporte e correlação de logs.
        fieldErrors:
          type: array
          description: Violações de campos presentes somente em erros de validação.
          items:
            $ref: "#/components/schemas/BetufuFieldViolation"

    SessionStateResponse:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - idleTimeout
        - absoluteTimeout
      properties:
        authenticated:
          type: boolean
        displayName:
          type: [string, "null"]
          description: Nome de exibição não sensível, ausente quando anônimo.
        idleTimeout:
          type: string
          description: Duração ISO-8601 do prazo de inatividade, sempre `PT8H`.
        absoluteTimeout:
          type: [string, "null"]
          description: >-
            Sempre nulo no MVP. Emitido explicitamente, per D-06, para
            representar a ausência de prazo absoluto em vez de omiti-la.
        lastValidActivityAt:
          type: [string, "null"]
          format: date-time

    CurrentDeviceLogoutResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - endSessionUrl
      properties:
        status:
          type: string
          enum:
            - LOGGED_OUT
            - END_SESSION_UNAVAILABLE
        endSessionUrl:
          type: [string, "null"]
          description: >-
            URL pública de RP-initiated logout, ou nulo quando o provedor não
            publica `end_session_endpoint`. Nunca contém token.

    DiagnosticResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - correlationId
        - timestamp
        - components
      properties:
        status:
          $ref: "#/components/schemas/DiagnosticStatus"
        summary:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        components:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/DiagnosticComponent"
        environment:
          type: [string, "null"]
        version:
          type: [string, "null"]

    DiagnosticComponent:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/DiagnosticStatus"
        detail:
          type: [string, "null"]
          description: Texto sanitizado, sem credencial, host interno ou stack trace.
        durationMs:
          type: [integer, "null"]
          format: int64

    DiagnosticStatus:
      type: string
      enum:
        - UP
        - DEGRADED
        - DOWN

    OperationalRole:
      type: string
      enum:
        - ADMINISTRADOR_GERAL
        - ADMINISTRADOR_COMPETICAO
        - MODERADOR
      description: Vocabulário fechado de papéis operacionais da BETUFU (D-46).

    RoleGrantRequest:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - role
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta alvo da concessão ou revogação.
        role:
          $ref: "#/components/schemas/OperationalRole"
        scopeRef:
          type: [string, "null"]
          format: uuid
          description: Identificador do escopo obrigatório para papéis escopados e proibido para global.

    RoleGrantResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - roles
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        nickname:
          type: [string, "null"]
          description: Apelido público do usuário, ou nulo se ainda não configurado.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleStatusDto"
          description: Lista de estados dos papéis operacionais da conta.

    PasswordResetEventRecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - sourceEventId
        - status
        - effectExecuted
        - terminatedSessionCount
        - actorIdentityId
        - processedAt
        - lastError
      properties:
        sourceEventId:
          type: string
          description: Identificador opaco e idempotente atribuido pela origem.
        status:
          type: string
          enum:
            - PENDING
            - CLAIMED
            - DELIVERED
            - FAILED
            - PROCESSED
        effectExecuted:
          type: boolean
          description: Indica se esta chamada executou o efeito de encerramento de sessoes.
        terminatedSessionCount:
          type: integer
          format: int32
          minimum: 0
          description: Quantidade de sessoes encerradas por esta chamada.
        actorIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco do administrador que executou o reprocessamento.
        processedAt:
          type: [string, "null"]
          format: date-time
          description: Instante UTC da ultima transicao observada ou executada.
        lastError:
          type: [string, "null"]
          description: Codigo operacional sanitizado da ultima falha, nunca detalhe bruto.

    PasswordResetEventRecoveryPageResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PasswordResetEventRecoveryResponse"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
        hasNext:
          type: boolean

    RoleStatusDto:
      type: object
      additionalProperties: false
      required:
        - role
        - status
      properties:
        role:
          $ref: "#/components/schemas/OperationalRole"
        status:
          type: string
          description: Estado do papel (ex. VIGENTE, NAO_CONCEDIDO).
        scopeRef:
          type: [string, "null"]
          format: uuid
          description: Identificador do escopo para concessões escopadas, ou nulo se global.

    OperationalPanelResponse:
      type: object
      additionalProperties: false
      required:
        - queriedAt
        - timeWindow
        - unavailableBlocks
      properties:
        queriedAt:
          type: string
          format: date-time
          description: Instante em UTC da realização da consulta.
        timeWindow:
          $ref: "#/components/schemas/TimeWindow"
        roleChanges:
          $ref: "#/components/schemas/RoleChangesBlock"
        rejectedEnrollmentsCount:
          $ref: "#/components/schemas/RejectedEnrollmentsBlock"
        administrativeCorrections:
          $ref: "#/components/schemas/AdministrativeCorrectionsBlock"
        unregisteredEnrollmentsCount:
          $ref: "#/components/schemas/UnregisteredEnrollmentsBlock"
        unavailableBlocks:
          type: array
          items:
            type: string
            enum:
              - ROLE_CHANGES
              - REJECTED_ENROLLMENTS_COUNT
              - ADMINISTRATIVE_CORRECTIONS
              - UNREGISTERED_ENROLLMENTS_COUNT
            description: Enumeração fechada dos blocos operacionais governados do painel.
          description: >-
            Lista fechada de blocos autorizados que falharam durante a consulta.
            Blocos fora do escopo do papel permanecem ausentes e nunca são
            listados aqui.

    TimeWindow:
      type: object
      additionalProperties: false
      required:
        - since
        - until
      properties:
        since:
          type: string
          format: date-time
          description: Instante inicial do recorte temporal.
        until:
          type: string
          format: date-time
          description: Instante final do recorte temporal.

    RoleChangesBlock:
      type: object
      additionalProperties: false
      required:
        - recentEvents
      properties:
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/RoleChangeEventDto"
          description: Lista de eventos recentes de alteração de papel.

    RoleChangeEventDto:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - action
        - outcome
        - hasReason
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador único do evento de auditoria.
        occurredAt:
          type: string
          format: date-time
          description: Instante em UTC da ocorrência do evento.
        actorIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco do autor da alteração, ou nulo se sistema.
        actorRole:
          type: [string, "null"]
          description: Papel do autor no momento da alteração.
        targetIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco da identidade afetada.
        targetNickname:
          type: [string, "null"]
          description: Apelido da identidade afetada no momento da alteração.
        action:
          type: string
          description: Ação executada (ex. PAPEL_CONCEDIDO, AUTOCONCESSAO_BLOQUEADA).
        outcome:
          type: string
          description: Resultado da ação (ex. PERMITTED, BLOCKED).
        hasReason:
          type: boolean
          description: Indica se o evento registrou motivo na auditoria interna.

    RejectedEnrollmentsBlock:
      type: object
      additionalProperties: false
      required:
        - duplicateCount
        - attemptLimitCount
        - totalCount
      properties:
        duplicateCount:
          type: integer
          format: int64
          minimum: 0
          description: Total de recusas por matrícula já vinculada a outra conta.
        attemptLimitCount:
          type: integer
          format: int64
          minimum: 0
          description: Total de recusas por excesso de tentativas na janela.
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: Soma fechada das categorias de recusa aprovadas.

    AdministrativeCorrectionsBlock:
      type: object
      additionalProperties: false
      required:
        - recentEvents
      properties:
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/AdministrativeCorrectionEventDto"
          description: Lista de eventos recentes de correção administrativa de matrícula.

    AdministrativeCorrectionEventDto:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - action
        - outcome
        - hasReason
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador único do evento de auditoria.
        occurredAt:
          type: string
          format: date-time
          description: Instante em UTC da ocorrência da correção.
        actorIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco do administrador autor da correção.
        actorRole:
          type: [string, "null"]
          description: Papel do administrador autor.
        targetIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco da identidade que teve a matrícula corrigida.
        targetNickname:
          type: [string, "null"]
          description: Apelido da identidade afetada.
        action:
          type: string
          description: Ação executada (ex. CORRECAO_MATRICULA).
        outcome:
          type: string
          description: Resultado da ação (ex. PERMITTED).
        hasReason:
          type: boolean
          description: Indica presença de motivo registrado.
        reason:
          type: [string, "null"]
          description: Motivo por extenso da correção administrativa (única projeção autorizada).

    UnregisteredEnrollmentsBlock:
      type: object
      additionalProperties: false
      required:
        - count
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Contagem agregada de contas sem matrícula ativa.
