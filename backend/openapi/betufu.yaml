      operationId: getDiagnostic
      summary: Consultar o diagnóstico das dependências da plataforma
      description: >-
        Existe somente nos profiles `dev` e `homolog`, per D-02: em produção não
        há bean nem mapping, e portanto o path não é alcançável. Exige a
        autoridade `ROLE_TECHNICAL`, produzida exclusivamente pelo handoff
        allowlistado da claim aprovada no Gate 1 do Plano 01-03.
      responses:
        "200":
          description: Projeção diagnóstica com exatamente seis componentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticResponse"
        "401":
          description: Requisição anônima.
        "403":
          description: Autenticado sem a autoridade técnica.

components:
  schemas:
    CurrentIdentityResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - status
        - createdAt
        - updatedAt
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        status:
          type: string
          enum:
            - PERSISTED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CurrentProfileResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - nickname
        - nicknameUpdatedAt
        - matriculaStatus
        - favoriteOrganizationId
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        nickname:
          type: string
          description: Apelido público do usuário (3 a 20 caracteres ASCII).
        nicknameUpdatedAt:
          type: [string, "null"]
          format: date-time
          description: Instante em UTC da última alteração do apelido, ou nulo se nunca alterado.
        matriculaStatus:
          type: string
          description: Estado de verificação de vínculo institucional.
        favoriteOrganizationId:
          type: [string, "null"]
          format: uuid
          description: Organização esportiva favorita, ou nulo quando não escolhida.

    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 3
          pattern: '^[\x00-\x20]*[A-Za-z0-9_-]{3,20}[\x00-\x20]*(?![\s\S])'
          description: >-
            Apelido desejado com 3 a 20 caracteres (ASCII letras, números,
            hífen ou sublinhado); caracteres de U+0000 a U+0020 nas pontas são
            removidos antes da validação, como em String.trim() no Java.

    FavoriteOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - organizationId
      properties:
        organizationId:
          type: [string, "null"]
          format: uuid
          description: ID estável da organização publicada; nulo remove o favorito.

    EnrollmentStatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - createdAt
      properties:
        status:
          type: string
          description: Estado do vínculo de matrícula institucional (ex. NAO_REGISTRADA, ATIVO).
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Instante em UTC do registro do vínculo, ou nulo se não registrado.

    EnrollmentRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - matricula
      properties:
        matricula:
          type: string
          description: >-
            Número de matrícula da UFU a ser vinculado à conta institucional
            (5 a 20 caracteres alfanuméricos após normalização e remoção de
            separadores).

    EnrollmentCorrectionRequest:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - matricula
        - reason
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta alvo da correção de matrícula.
        matricula:
          type: string
          description: >-
            Novo número de matrícula da UFU a ser vinculado à conta institucional
            (5 a 20 caracteres alfanuméricos após normalização e remoção de
            separadores).
        reason:
          type: string
          minLength: 10
          maxLength: 1024
          x-betufu-max-utf8-bytes: 1024
          description: >-
            Motivo auditável por extenso da correção administrativa (mínimo de 10
            caracteres e máximo autoritativo de 1024 octetos UTF-8). O maxLength
            documenta o teto em caracteres; o backend também mede os bytes UTF-8.

    EnrollmentCorrectionResponse:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - status
        - correctedAt
        - previousBindingReleased
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta corrigida.
        status:
          type: string
          description: Estado do vínculo resultante (ex. ATIVO).
        correctedAt:
          type: string
          format: date-time
          description: Instante em UTC da correção do vínculo atribuído pelo PostgreSQL.
        previousBindingReleased:
          type: boolean
          description: Indica se havia vínculo anterior e se ele foi liberado.

    BetufuFieldViolation:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Nome estável do campo recusado.
        message:
          type: string
          description: Explicação pública e sanitizada da violação.

    BetufuProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - code
        - action
      properties:
        type:
          type: string
          format: uri-reference
          description: Identificador RFC 9457 do tipo do problema; about:blank quando genérico.
        title:
          type: string
          description: Título público estável em português.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: Status HTTP associado ao problema.
        detail:
          type: string
          description: Explicação pública sanitizada, sem detalhe interno ou dado sensível.
        instance:
          type: string
          format: uri-reference
          description: Identificador opcional da ocorrência segundo RFC 9457.
        code:
          type: string
          description: Código BETUFU estável para decisão do cliente.
        action:
          type: string
          description: Ação segura recomendada à pessoa usuária.
        correlationId:
          type: string
          description: Código opaco opcional para suporte e correlação de logs.
        fieldErrors:
          type: array
          description: Violações de campos presentes somente em erros de validação.
          items:
            $ref: "#/components/schemas/BetufuFieldViolation"

    SessionStateResponse:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - idleTimeout
        - absoluteTimeout
      properties:
        authenticated:
          type: boolean
        displayName:
          type: [string, "null"]
          description: Nome de exibição não sensível, ausente quando anônimo.
        idleTimeout:
          type: string
          description: Duração ISO-8601 do prazo de inatividade, sempre `PT8H`.
        absoluteTimeout:
          type: [string, "null"]
          description: >-
            Sempre nulo no MVP. Emitido explicitamente, per D-06, para
            representar a ausência de prazo absoluto em vez de omiti-la.
        lastValidActivityAt:
          type: [string, "null"]
          format: date-time

    CurrentDeviceLogoutResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - endSessionUrl
      properties:
        status:
          type: string
          enum:
            - LOGGED_OUT
            - END_SESSION_UNAVAILABLE
        endSessionUrl:
          type: [string, "null"]
          description: >-
            URL pública de RP-initiated logout, ou nulo quando o provedor não
            publica `end_session_endpoint`. Nunca contém token.

    DiagnosticResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - correlationId
        - timestamp
        - components
      properties:
        status:
          $ref: "#/components/schemas/DiagnosticStatus"
        summary:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        components:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/DiagnosticComponent"
        environment:
          type: [string, "null"]
        version:
          type: [string, "null"]

    DiagnosticComponent:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/DiagnosticStatus"
        detail:
          type: [string, "null"]
          description: Texto sanitizado, sem credencial, host interno ou stack trace.
        durationMs:
          type: [integer, "null"]
          format: int64

    DiagnosticStatus:
      type: string
      enum:
        - UP
        - DEGRADED
        - DOWN

    OperationalRole:
      type: string
      enum:
        - ADMINISTRADOR_GERAL
        - ADMINISTRADOR_COMPETICAO
        - MODERADOR
      description: Vocabulário fechado de papéis operacionais da BETUFU (D-46).

    RoleGrantRequest:
      type: object
      additionalProperties: false
      required:
        - targetIdentityId
        - role
      properties:
        targetIdentityId:
          type: string
          format: uuid
          description: Identificador opaco da conta alvo da concessão ou revogação.
        role:
          $ref: "#/components/schemas/OperationalRole"
        scopeRef:
          type: [string, "null"]
          format: uuid
          description: Identificador do escopo obrigatório para papéis escopados e proibido para global.

    RoleGrantResponse:
      type: object
      additionalProperties: false
      required:
        - identityId
        - roles
      properties:
        identityId:
          type: string
          format: uuid
          description: Identificador opaco da identidade BETUFU.
        nickname:
          type: [string, "null"]
          description: Apelido público do usuário, ou nulo se ainda não configurado.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleStatusDto"
          description: Lista de estados dos papéis operacionais da conta.

    PasswordResetEventRecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - sourceEventId
        - status
        - effectExecuted
        - terminatedSessionCount
        - actorIdentityId
        - processedAt
        - lastError
      properties:
        sourceEventId:
          type: string
          description: Identificador opaco e idempotente atribuido pela origem.
        status:
          type: string
          enum:
            - PENDING
            - CLAIMED
            - DELIVERED
            - FAILED
            - PROCESSED
        effectExecuted:
          type: boolean
          description: Indica se esta chamada executou o efeito de encerramento de sessoes.
        terminatedSessionCount:
          type: integer
          format: int32
          minimum: 0
          description: Quantidade de sessoes encerradas por esta chamada.
        actorIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco do administrador que executou o reprocessamento.
        processedAt:
          type: [string, "null"]
          format: date-time
          description: Instante UTC da ultima transicao observada ou executada.
        lastError:
          type: [string, "null"]
          description: Codigo operacional sanitizado da ultima falha, nunca detalhe bruto.

    PasswordResetEventRecoveryPageResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PasswordResetEventRecoveryResponse"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
        hasNext:
          type: boolean

    RoleStatusDto:
      type: object
      additionalProperties: false
      required:
        - role
        - status
      properties:
        role:
          $ref: "#/components/schemas/OperationalRole"
        status:
          type: string
          description: Estado do papel (ex. VIGENTE, NAO_CONCEDIDO).
        scopeRef:
          type: [string, "null"]
          format: uuid
          description: Identificador do escopo para concessões escopadas, ou nulo se global.

    OperationalPanelResponse:
      type: object
      additionalProperties: false
      required:
        - queriedAt
        - timeWindow
        - unavailableBlocks
      properties:
        queriedAt:
          type: string
          format: date-time
          description: Instante em UTC da realização da consulta.
        timeWindow:
          $ref: "#/components/schemas/TimeWindow"
        roleChanges:
          $ref: "#/components/schemas/RoleChangesBlock"
        rejectedEnrollmentsCount:
          $ref: "#/components/schemas/RejectedEnrollmentsBlock"
        administrativeCorrections:
          $ref: "#/components/schemas/AdministrativeCorrectionsBlock"
        unregisteredEnrollmentsCount:
          $ref: "#/components/schemas/UnregisteredEnrollmentsBlock"
        unavailableBlocks:
          type: array
          items:
            type: string
            enum:
              - ROLE_CHANGES
              - REJECTED_ENROLLMENTS_COUNT
              - ADMINISTRATIVE_CORRECTIONS
              - UNREGISTERED_ENROLLMENTS_COUNT
            description: Enumeração fechada dos blocos operacionais governados do painel.
          description: >-
            Lista fechada de blocos autorizados que falharam durante a consulta.
            Blocos fora do escopo do papel permanecem ausentes e nunca são
            listados aqui.

    TimeWindow:
      type: object
      additionalProperties: false
      required:
        - since
        - until
      properties:
        since:
          type: string
          format: date-time
          description: Instante inicial do recorte temporal.
        until:
          type: string
          format: date-time
          description: Instante final do recorte temporal.

    RoleChangesBlock:
      type: object
      additionalProperties: false
      required:
        - recentEvents
      properties:
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/RoleChangeEventDto"
          description: Lista de eventos recentes de alteração de papel.

    RoleChangeEventDto:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - action
        - outcome
        - hasReason
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador único do evento de auditoria.
        occurredAt:
          type: string
          format: date-time
          description: Instante em UTC da ocorrência do evento.
        actorIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco do autor da alteração, ou nulo se sistema.
        actorRole:
          type: [string, "null"]
          description: Papel do autor no momento da alteração.
        targetIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco da identidade afetada.
        targetNickname:
          type: [string, "null"]
          description: Apelido da identidade afetada no momento da alteração.
        action:
          type: string
          description: Ação executada (ex. PAPEL_CONCEDIDO, AUTOCONCESSAO_BLOQUEADA).
        outcome:
          type: string
          description: Resultado da ação (ex. PERMITTED, BLOCKED).
        hasReason:
          type: boolean
          description: Indica se o evento registrou motivo na auditoria interna.

    RejectedEnrollmentsBlock:
      type: object
      additionalProperties: false
      required:
        - duplicateCount
        - attemptLimitCount
        - totalCount
      properties:
        duplicateCount:
          type: integer
          format: int64
          minimum: 0
          description: Total de recusas por matrícula já vinculada a outra conta.
        attemptLimitCount:
          type: integer
          format: int64
          minimum: 0
          description: Total de recusas por excesso de tentativas na janela.
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: Soma fechada das categorias de recusa aprovadas.

    AdministrativeCorrectionsBlock:
      type: object
      additionalProperties: false
      required:
        - recentEvents
      properties:
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/AdministrativeCorrectionEventDto"
          description: Lista de eventos recentes de correção administrativa de matrícula.

    AdministrativeCorrectionEventDto:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - action
        - outcome
        - hasReason
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador único do evento de auditoria.
        occurredAt:
          type: string
          format: date-time
          description: Instante em UTC da ocorrência da correção.
        actorIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco do administrador autor da correção.
        actorRole:
          type: [string, "null"]
          description: Papel do administrador autor.
        targetIdentityId:
          type: [string, "null"]
          format: uuid
          description: Identificador opaco da identidade que teve a matrícula corrigida.
        targetNickname:
          type: [string, "null"]
          description: Apelido da identidade afetada.
        action:
          type: string
          description: Ação executada (ex. CORRECAO_MATRICULA).
        outcome:
          type: string
          description: Resultado da ação (ex. PERMITTED).
        hasReason:
          type: boolean
          description: Indica presença de motivo registrado.
        reason:
          type: [string, "null"]
          description: Motivo por extenso da correção administrativa (única projeção autorizada).

    UnregisteredEnrollmentsBlock:
      type: object
      additionalProperties: false
      required:
        - count
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Contagem agregada de contas sem matrícula ativa.

    SportsNameSlugRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 1
          maxLength: 96
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

    SportsCatalogEditionRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 1
          maxLength: 96
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        startDate:
          type: [string, "null"]
          format: date
        endDate:
          type: [string, "null"]
          format: date
        expectedLockVersion:
          type: [integer, "null"]
          format: int64
          minimum: 0

    SportsCatalogVenueRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        address:
          type: [string, "null"]
          maxLength: 320
        mapUrl:
          type: [string, "null"]
          maxLength: 2048
        notes:
          type: [string, "null"]
          maxLength: 2000
        expectedLockVersion:
          type: [integer, "null"]
          format: int64
          minimum: 0

    SportsCatalogVenueSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        notes:
          type: [string, "null"]
          maxLength: 1000
        expectedLockVersion:
          type: [integer, "null"]
          format: int64
          minimum: 0

    SportsSportSummary:
      type: object
      additionalProperties: false
      required:
        - sportId
        - name
        - slug
        - status
        - lockVersion
      properties:
        sportId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - ATIVA
        lockVersion:
          type: integer
          format: int64
          minimum: 0

    SportsOrganizationSummary:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - name
        - slug
        - status
        - lockVersion
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - RASCUNHO
            - PUBLICADO
        lockVersion:
          type: integer
          format: int64
          minimum: 0

    SportsTeamSummary:
      type: object
      additionalProperties: false
      required:
        - teamId
        - organizationId
        - organizationName
        - competitionId
        - editionId
        - sportId
        - sportName
        - categoryId
        - categoryName
        - name
        - slug
        - status
        - lockVersion
      properties:
        teamId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        competitionId:
          type: string
          format: uuid
        editionId:
          type: string
          format: uuid
        sportId:
          type: string
          format: uuid
        sportName:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - RASCUNHO
            - PUBLICADO
        lockVersion:
          type: integer
          format: int64
          minimum: 0

    SportsCompetitionSummary:
      type: object
      additionalProperties: false
      required:
        - competitionId
        - name
        - slug
        - status
        - lockVersion
        - sportId
        - sportName
      properties:
        competitionId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - ATIVA
        lockVersion:
          type: integer
          format: int64
          minimum: 0
        sportId:
          type: [string, "null"]
          format: uuid
        sportName:
          type: [string, "null"]

    SportsEditionSummary:
      type: object
      additionalProperties: false
      required:
        - editionId
        - competitionId
        - name
        - slug
        - startDate
        - endDate
        - status
        - lockVersion
      properties:
        editionId:
          type: string
          format: uuid
        competitionId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        startDate:
          type: [string, "null"]
          format: date
        endDate:
          type: [string, "null"]
          format: date
        status:
          type: string
          enum:
            - ATIVA
        lockVersion:
          type: integer
          format: int64
          minimum: 0

    SportsCategorySummary:
      type: object
      additionalProperties: false
      required:
        - categoryId
        - editionId
        - name
        - slug
        - status
        - lockVersion
      properties:
        categoryId:
          type: string
          format: uuid
        editionId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - ATIVA
        lockVersion:
          type: integer
          format: int64
          minimum: 0

    SportsPhaseSummary:
      type: object
      additionalProperties: false
      required:
        - phaseId
        - editionId
        - categoryId
        - name
        - slug
        - status
        - lockVersion
      properties:
        phaseId:
          type: string
          format: uuid
        editionId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - ATIVA
        lockVersion:
          type: integer
          format: int64
          minimum: 0

    SportsVenueSpaceSummary:
      type: object
      additionalProperties: false
      required:
        - venueSpaceId
        - venueId
        - name
        - notes
        - lockVersion
      properties:
        venueSpaceId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: [string, "null"]
        lockVersion:
          type: integer
          format: int64
          minimum: 0

    SportsVenueSummary:
      type: object
      additionalProperties: false
      required:
        - venueId
        - competitionId
        - name
        - address
        - mapUrl
        - notes
        - lockVersion
        - spaces
      properties:
        venueId:
          type: string
          format: uuid
