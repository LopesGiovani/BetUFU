          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resultado da validação tabular e resumo de importação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsTabularImportPreview"
