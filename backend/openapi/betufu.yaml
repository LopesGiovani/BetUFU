        - summary
        - correlationId
        - timestamp
        - components
      properties:
        status:
          $ref: "#/components/schemas/DiagnosticStatus"
        summary:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        components:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/DiagnosticComponent"
        environment:
          type: [string, "null"]
        version:
          type: [string, "null"]

    DiagnosticComponent:
      type: object
